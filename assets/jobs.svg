<linearGradient id="hl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d8a94a"/><stop offset="1" stop-color="#d8a94a" stop-opacity="0"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity=".10"/><stop offset="1" stop-color="#051e24" stop-opacity=".75"/></linearGradient>
<linearGradient id="pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0b45a"/><stop offset="1" stop-color="#9c7326"/></linearGradient>
</defs>
