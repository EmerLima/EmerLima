<circle cx="40" cy="106" r="6" fill="#04161b" stroke="#00f0ff" stroke-width="2" filter="url(#glow2)"/>
<text class="m" x="88" y="110" font-size="11" letter-spacing="1" fill="#d8a94a">04/2025 – 06/2026</text>
<text class="d" x="88" y="134" font-size="15" letter-spacing="1" fill="#fff">LASER ARGENTINA S.A.</text>
<text class="m" x="88" y="156" font-size="13" fill="#00f0ff">Técnico Electrónico</text>
<text class="m pre" x="88" y="180" font-size="12" fill="#b9dede">•  Ensamblado y testeo funcional de equipos en línea de producción</text>
<text class="m pre" x="88" y="199" font-size="12" fill="#b9dede">•  Carga de firmware, serialización y validación de modelos</text>
<text class="m pre" x="88" y="218" font-size="12" fill="#b9dede">•  Redes en Linux, diagnóstico de hardware y trazabilidad por número de serie</text>
<rect x="88" y="239" width="72.4" height="20" rx="2" fill="none" stroke="#d8a94a" stroke-opacity=".5"/><text class="m" x="124.2" y="253" font-size="11" text-anchor="middle" fill="#d8a94a">Firmware</text>
<rect x="168.4" y="239" width="52.0" height="20" rx="2" fill="none" stroke="#d8a94a" stroke-opacity=".5"/><text class="m" x="194.4" y="253" font-size="11" text-anchor="middle" fill="#d8a94a">Linux</text>
<rect x="228.4" y="239" width="65.6" height="20" rx="2" fill="none" stroke="#d8a94a" stroke-opacity=".5"/><text class="m" x="261.2" y="253" font-size="11" text-anchor="middle" fill="#d8a94a">Testing</text>
<polygon points="70,299 816,299 832,315 832,498 70,498" fill="url(#card)" stroke="#00f0ff" stroke-opacity=".35"/>
<circle cx="40" cy="321" r="6" fill="#04161b" stroke="#00f0ff" stroke-width="2" filter="url(#glow2)"/>
<text class="m" x="88" y="325" font-size="11" letter-spacing="1" fill="#d8a94a">02/2022 – 08/2023</text>
<text class="d" x="88" y="349" font-size="15" letter-spacing="1" fill="#fff">SUNZONE</text>
<text class="m" x="88" y="371" font-size="13" fill="#00f0ff">Desarrollador de Software Embebido</text>
<text class="m pre" x="88" y="395" font-size="12" fill="#b9dede">•  Software en C, validación y depuración sobre hardware</text>
<text class="m pre" x="88" y="414" font-size="12" fill="#b9dede">•  Documentación técnica e instructivos de instalación</text>
<text class="m pre" x="88" y="433" font-size="12" fill="#b9dede">•  Prototipos con Arduino: sensores ultrasónicos y RF</text>
<rect x="88" y="454" width="24.8" height="20" rx="2" fill="none" stroke="#d8a94a" stroke-opacity=".5"/><text class="m" x="100.4" y="468" font-size="11" text-anchor="middle" fill="#d8a94a">C</text>
<rect x="120.8" y="454" width="65.6" height="20" rx="2" fill="none" stroke="#d8a94a" stroke-opacity=".5"/><text class="m" x="153.6" y="468" font-size="11" text-anchor="middle" fill="#d8a94a">Arduino</text>
<rect x="194.39999999999998" y="454" width="31.6" height="20" rx="2" fill="none" stroke="#d8a94a" stroke-opacity=".5"/><text class="m" x="210.2" y="468" font-size="11" text-anchor="middle" fill="#d8a94a">RF</text>
<polygon points="70,514 816,514 832,530 832,675 70,675" fill="url(#card)" stroke="#00f0ff" stroke-opacity=".35"/>
<circle cx="40" cy="536" r="6" fill="#04161b" stroke="#00f0ff" stroke-width="2" filter="url(#glow2)"/>
<text class="m" x="88" y="540" font-size="11" letter-spacing="1" fill="#d8a94a">02/2019 – 10/2019</text>
<text class="d" x="88" y="564" font-size="15" letter-spacing="1" fill="#fff">SIRION S.A.</text>
<text class="m" x="88" y="586" font-size="13" fill="#00f0ff">Técnico Electrónico (Pasantía)</text>
<text class="m pre" x="88" y="610" font-size="12" fill="#b9dede">•  Montaje de tableros, control de calidad y capacitación de personal nuevo</text>
<rect x="88" y="631" width="72.4" height="20" rx="2" fill="none" stroke="#d8a94a" stroke-opacity=".5"/><text class="m" x="124.2" y="645" font-size="11" text-anchor="middle" fill="#d8a94a">Tableros</text>
<rect x="168.4" y="631" width="65.6" height="20" rx="2" fill="none" stroke="#d8a94a" stroke-opacity=".5"/><text class="m" x="201.2" y="645" font-size="11" text-anchor="middle" fill="#d8a94a">Calidad</text>
<path d="M.5 .5H859.5V702.5H.5Z" fill="none" stroke="#00f0ff" stroke-opacity=".35"/>
