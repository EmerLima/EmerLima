<svg xmlns="http://www.w3.org/2000/svg" width="860" height="703" viewBox="0 0 860 703" role="img" aria-labelledby="t d">
<title id="t">Historial de misiones</title>
<desc id="d">Experiencia: Laser Argentina S.A. (04/2025 a 06/2026), Técnico Electrónico. Sunzone (02/2022 a 08/2023), Desarrollador de Software Embebido. Sirion S.A. (02/2019 a 10/2019), Técnico Electrónico en pasantía.</desc>
<defs>
