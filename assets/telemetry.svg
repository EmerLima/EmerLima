<svg xmlns="http://www.w3.org/2000/svg" width="860" height="236" viewBox="0 0 860 236" role="img" aria-labelledby="t d">
<title id="t">Telemetría</title>
<desc id="d">Cerca de 3,5 años de experiencia en 3 empresas. Ingeniería Electrónica en la UTN, 3er año. Español nativo, inglés intermedio.</desc>
<defs>
